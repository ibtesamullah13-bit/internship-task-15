
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowCart Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <nav class="navbar">
        <h1>GlowCart</h1>
        <a href="#products">Products</a>
        <a href="#cart">My Cart 🛒 <span id="cart-count">0</span></a>
    </nav>
   <header class="hero">
        <h2>Welcome to GlowCart!</h2>
        <p>Find your favorite products at great prices.</p>
        <input
            type="text"
            id="search"
            placeholder="Search for a product..."
        >
    </header>
   <main>
        <h2 id="products">Our Products</h2>

        <div class="product-container" id="product-container">

            <div class="product-card" data-name="Headphones">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
                     alt="Headphones">
                <h3>Headphones</h3>
                <p>Rs. 2,500</p>
                <button class="add-btn" data-name="Headphones"
                        data-price="2500">Add to Cart</button>
            </div>

            <div class="product-card" data-name="Smart Watch">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
                     alt="Smart Watch">
                <h3>Smart Watch</h3>
                <p>Rs. 4,000</p>
                <button class="add-btn" data-name="Smart Watch"
                        data-price="4000">Add to Cart</button>
            </div>

            <div class="product-card" data-name="Shoes">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
                     alt="Red Shoes">
                <h3>Shoes</h3>
                <p>Rs. 3,500</p>
                <button class="add-btn" data-name="Shoes"
                        data-price="3500">Add to Cart</button>
            </div>
           <div class="product-card" data-name="Backpack">
                <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"
                     alt="Backpack">
                <h3>Backpack</h3>
                <p>Rs. 2,000</p>
                <button class="add-btn" data-name="Backpack"
                        data-price="2000">Add to Cart</button>
            </div>

        </div>
       <section class="cart-section" id="cart">
            <h2>My Shopping Cart 🛒</h2>
            <div id="cart-items">
                <p>Your cart is empty .</p>
            </div>
            <h3>Total: <span id="total">Rs. 0</span></h3>
        </section>
    </main>
   <footer>
        <p>© 2026 GlowCart | Simple Shopping Website</p>
    </footer>
   <script src="script.js"></script>
</body>
</html>
